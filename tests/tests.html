const results = [];
const test = (name, fn) => {
  try { const detail = fn(); results.push({ name, ok: true, detail }); }
  catch (e) { results.push({ name, ok: false, detail: e.message }); }
};
const assert = (c, msg) => { if (!c) throw new Error(msg); };
const run = (w, seconds) => { for (let i = 0, n = seconds * 60; i < n; i++) w.step(); };
const count = (w, id) => { const k = w.data.idOf[id]; return w.mat.reduce((s, m) => s + (m === k ? 1 : 0), 0); };
const fresh = () => new SandLab.World();
const scene = (w, id) => SandLab.SCENES.find((s) => s.id === id).setup(w);

// 두 물질을 맞붙여 놓고, 일어난 반응과 생긴 물질을 돌려준다.
function mix(a, b, T, ticks, want, near) {
  const w = new SandLab.World({ width: 40, height: 20 });
  w.rect(a, 0, 0, 19, 19, T);
  w.rect(b, 20, 0, 39, 19, T);
  if (near) for (let y = 0; y < 20; y += 3) w.rect(near, 19, y, 20, y, T); // 촉매·조건 물질을 경계에 띄엄띄엄
  for (let i = 0; i < (ticks || 800) && !w.discovered.has(want); i++) w.stepCells();
  const events = w.drainEvents();
  return { w, ids: events.map((e) => e.id), eq: events.map((e) => e.eq).join(' / '), names: events.map((e) => e.name) };
}

// ---- 화학 데이터 ----
test('주기율표 118칸이 겹치지 않고, 반응이 있는 원소만 물질로 만듦', () => {
  assert(SandLab.ELEMENTS.length === 118, `원소 ${SandLab.ELEMENTS.length}종`);
  const kept = SandLab.ELEMENTS.filter((e) => !SandLab.ELEMENT_SKIP.has(e.sym)).map((e) => e.sym);
  for (const sym of ['H', 'He', 'Li', 'C', 'N', 'O', 'Na', 'Mg', 'Al', 'Si', 'P', 'S', 'Cl', 'K', 'Ca', 'Fe', 'Cu', 'Zn', 'Ag', 'Au', 'Hg', 'Pb', 'U', 'Pu', 'W', 'Ga', 'Cd', 'B']) assert(kept.includes(sym), sym + ' 빠짐');
  for (const sym of ['Og', 'Lu', 'Os', 'Tc']) assert(!SandLab.MATERIALS.some((d) => d.el === sym), sym + ' 남아 있음');
  const seen = new Set();
  for (const e of SandLab.ELEMENTS) {
    const key = SandLab.elementCell(e.z).join();
    assert(!seen.has(key), `${e.sym} 자리 겹침 ${key}`);
    seen.add(key);
  }
  return `원소 ${kept.length}종, 물질 전체 ${SandLab.MATERIALS.length}종`;
});

test('화학식 생성이 원자가와 일치', () => {
  const need = ['S:NaCl', 'S:CaCl2', 'S:Al2O3', 'S:Fe2O3', 'S:Fe(OH)3', 'S:Ca3(PO4)2', 'S:Al2(SO4)3', 'S:(NH4)2SO4', 'S:Pb(NO3)2', 'S:AgNO3', 'S:KMnO4', 'S:Ca(CH3COO)2', 'S:MnO2', 'S:Cr2O3', 'S:WO3'];
  const w = fresh();
  for (const id of need) assert(w.data.idOf[id] != null, `${id} 없음`);
  return `${need.length}종 확인`;
});

test('모든 반응 대상과 생성물이 실제 물질임', () => {
  const w = fresh();
  for (const r of SandLab.REACTIONS) for (const id of [r.a, r.b]) assert(w.data.idOf[id] != null, id);
  return `${SandLab.REACTIONS.length}개 표 규칙`;
});

test('일반 규칙이 모든 물질 쌍에서 오류 없이 실행되고 생성물이 실제로 있음', () => {
  const w = fresh(), defs = w.data.defs, res = w.data.resolve;
  let pairs = 0, rules = 0;
  const check = (to) => { if (to != null) res(to); };
  for (const A of defs) for (const B of defs) {
    pairs++;
    for (const r of SandLab.CHEM.rulesFor(A, B)) { rules++; check(r.toA); check(r.toB); }
  }
  return `${pairs.toLocaleString()}쌍에서 반응 ${rules.toLocaleString()}개`;
});

test('화학식 균형', () => {
  const b = (r, p) => SandLab.CHEM.balance(r, p).join(' ');
  const cases = [
    [['Na', 'H2O'], ['NaOH', 'H2'], '2 2 2 1'],
    [['Fe', 'O2'], ['Fe2O3'], '4 3 2'],
    [['Cu', 'HNO3'], ['Cu(NO3)2', 'NO2', 'H2O'], '1 4 1 2 2'],
    [['Al', 'HCl'], ['AlCl3', 'H2'], '2 6 2 3'],
    [['C3H8', 'O2'], ['CO2', 'H2O'], '1 5 3 4'],
    [['CaCO3', 'HCl'], ['CaCl2', 'CO2', 'H2O'], '1 2 1 1 1'],
    [['Al', 'Fe2O3'], ['Al2O3', 'Fe'], '2 1 1 2'],
    [['C57H104O6', 'O2'], ['CO2', 'H2O'], '1 80 57 52'],
  ];
  for (const [r, p, want] of cases) assert(b(r, p) === want, `${r}→${p}: ${b(r, p)}`);
  return `${cases.length}개 일치`;
});

test('실제로 나타나는 모든 화학 반응식의 원자 수가 맞음', () => {
  const w = fresh(), defs = w.data.defs;
  let total = 0; const bad = new Set();
  for (const A of defs) for (const B of defs) for (const r of SandLab.CHEM.rulesFor(A, B)) {
    if (r.eq || !r.reactants || !r.reactants.length || r.silent) continue;
    total++;
    if (!SandLab.CHEM.balance(r.reactants, r.products)) bad.add(r.reactants.join('+') + '→' + r.products.join('+'));
  }
  const sample = [...bad].slice(0, 8).join(' | ');
  assert(bad.size / total < 0.03, `균형 실패 ${bad.size}/${total}: ${sample}`);
  return `${total.toLocaleString()}개 중 실패 ${bad.size}개${bad.size ? ': ' + sample : ''}`;
});

test('표로 지정한 특수 반응식의 원자 수가 맞음', () => {
  const bad = [];
  let total = 0;
  for (const r of SandLab.REACTIONS) {
    if (r.eq || !r.reactants || !r.reactants.length) continue;
    total++;
    if (!SandLab.CHEM.balance(r.reactants, r.products)) bad.push(r.id);
  }
  assert(!bad.length, '균형 실패: ' + [...new Set(bad)].join(', '));
  return `${total}개 일치`;
});

const heatTo = (id, T, ticks) => {
  const w = fresh(); w.rect(id, 100, 50, 110, 60, T);
  const i = w.index(105, 55);
  for (let n = 0; n < (ticks || 3000); n++) { w.T[i] = T; w.phase(i, w.mat[i]); }
  return w.data.defs[w.mat[i]].id;
};
test('녹는점과 끓는점: 위에서는 변하고 아래에서는 안 변함', () => {
  const cases = [['Fe', 1538, 'Fe:l'], ['Cu', 1085, 'Cu:l'], ['Al', 660.3, 'Al:l'], ['Pb', 327.5, 'Pb:l'], ['Ga', 29.8, 'Ga:l'], ['W', 3422, 'W:l'], ['S', 115.2, 'S:l:dark'], ['H2O:s', 0, 'H2O:l'], ['S:NaCl', 801, 'M:NaCl'], ['stone', 1215, 'lava'], ['sand', 1713, 'moltenglass']];
  for (const [id, at, to] of cases) {
    const start = fresh().data.defs[fresh().data.idOf[id]].id;
    assert(heatTo(id, at - 5) === start, `${id}: ${at - 5}°C에서 변함`);
    assert(heatTo(id, at + 50) === to, `${id}: ${at + 50}°C에서 ${heatTo(id, at + 50)}`);
  }
  const boil = [['water', 100, 'H2O:g'], ['Hg', 356.7, 'Hg:g'], ['Br', 58.8, 'Br:g'], ['C2H5OH', 78.4, 'C2H5OH:g'], ['Fe:l', 2862, 'Fe:g']];
  for (const [id, at, to] of boil) assert(heatTo(id, at + 100, 20000) === to, `${id}: ${heatTo(id, at + 100, 20000)}`);
  assert(heatTo('CO2:s', -60) === 'CO2:g', '드라이아이스 승화');
  assert(heatTo('C', 3700) === 'C:g', '탄소 승화');
  return `${cases.length + boil.length + 2}개 일치`;
});
test('20°C 상태: 수은과 브로민은 액체, 산소는 기체, 철은 고체', () => {

test('부동태: 진한 질산·황산에서 철과 알루미늄은 차가우면 멈추고 가열하면 녹음', () => {
  const out = [];
  for (const [metal, acid, gas] of [['Fe', 'HNO3', 'hno3:Fe:NO2'], ['Al', 'HNO3', 'hno3:Al:NO2'], ['Fe', 'H2SO4', 'h2so4c:Fe'], ['Al', 'H2SO4', 'h2so4c:Al']]) {
    const cold = mix(metal, acid, 20, 1500, gas);
    assert(!cold.ids.includes(gas), `${metal}+${acid} 상온에서 반응함`);
    assert(cold.ids.some((id) => id.startsWith('passive:')), `${metal}+${acid} 부동태 없음`);
    const hot = mix(metal, acid, 130, 3000, gas);
    assert(hot.ids.includes(gas), `${metal}+${acid} 가열해도 반응 없음: ${hot.ids}`);
    out.push(hot.eq.split(' / ').find((e) => e.includes('→')));
  }
  assert(!mix('Fe', 'HNO3aq', 20, 2000, 'hno3:Fe:NO').ids.some((id) => id.startsWith('passive:')), '묽은 질산에서 부동태가 생김');
  return out.join(' , ');
});
test('지시약: 지시약마다 변색 범위(pH)가 다름', () => {
  const after = (ind, sol) => {

    w.rect(ind, 0, 0, 19, 19); w.rect(sol, 20, 0, 39, 19);
    for (let i = 0; i < 400; i++) w.stepCells();
    const left = w.mat[w.index(19, 10)];
    return w.data.defs[left].id;
  };
  const cases = [
    ['btb', 'vinegar', 'btb:yellow'], ['btb', 'A:acid:H2CO3', 'btb:yellow'], ['btb', 'A:NaHCO3', 'btb:blue'], ['btb', 'naoh', 'btb:blue'], ['btb', 'brine', 'btb'],
    ['litmus', 'A:acid:H2CO3', 'litmus:red'], ['litmus', 'NH4OH:aq', 'litmus:blue'], ['litmus', 'A:NH4Cl', 'litmus'],
    ['phth', 'A:Na2CO3', 'phth:pink'], ['phth', 'vinegar', 'phth'], ['phth:pink', 'hcl', 'phth'], ['phth', 'A:CuSO4', 'phth'],
  ];
  for (const [ind, sol, want] of cases) { const got = after(ind, sol); assert(got === want, `${ind}+${sol}: ${got}, 기대 ${want}`); }
  const pH = (id) => SandLab.MATERIALS.find((d) => d.id === id).pH;
  assert(pH('A:NaCl') === 7 && pH('A:FeCl3') < 4 && pH('A:Na2CO3') > 11 && pH('A:acid:HCl') < 2 && pH('A:Ca(OH)2') > 12, 'pH 값 이상');

test('핵분열: 임계 질량, 감속재, 제어봉', () => {
  const trial = (mat, r, env) => {
    const w = fresh(); w.rect('stone', 0, 146, 239, 149);
    if (env === 'water') w.rect('water', 60, 90, 180, 145);
    w.forDisc(120, 120, r, (i) => w.setCell(i, w.data.idOf[mat], 20));
    if (env === 'rods') for (let x = 120 - r; x <= 120 + r; x += 3) w.rect('controlrod', x, 120 - r, x, 145);
    run(w, 10);
    return w.discovered;
  };
  const out = [];
  const big = trial('HEU', 14); assert(big.has('chain') && big.has('nuke'), '임계 질량을 넘은 농축 우라늄이 폭발하지 않음'); out.push('농축 우라늄 큰 덩어리 폭발');
  const pu = trial('Pu', 10); assert(pu.has('nuke'), '플루토늄이 더 작은 덩어리로 폭발하지 않음'); out.push('플루토늄은 더 작은 덩어리로 폭발');
  const small = trial('HEU', 6); assert(!small.has('nuke') && !small.has('chain'), '작은 덩어리가 연쇄 반응함'); out.push('작은 덩어리는 안전');
  const nat = trial('U', 16); assert(!nat.has('chain') && !nat.has('nuke'), '천연 우라늄이 연쇄 반응함'); out.push('천연 우라늄은 반응 없음');
  const wat = trial('HEU', 9, 'water'); assert(!wat.has('nuke') && (wat.has('meltdown') || wat.has('chain')), `물속: ${[...wat].join()}`); out.push('물속에서는 녹을 뿐 폭발하지 않음');
  const rods = trial('HEU', 14, 'rods'); assert(!rods.has('nuke') && !rods.has('chain'), '제어봉이 연쇄 반응을 막지 못함'); out.push('제어봉이 막음');
  return out.join(', ');
});

  const P1 = a.pressureAt(pi(a)), want = (293 + 273.15) / 293.15;
  assert(Math.abs(P1 - want) / want < 0.02, `293°C에서 ${P1.toFixed(3)}기압, 기대 ${want.toFixed(3)}`);
  const b = jar(); for (let y = 104; y < 142; y++) for (let x = 104; x < 137; x++) { const i = b.index(x, y); b.setCell(i, b.data.idOf.steam, 150); b.gas[i] = 6; } b.stepPressure();
  assert(b.discovered.has('burst') && count(b, 'glassshards') > 0, '수증기가 가득 찬 유리병이 터지지 않음');

test('진공 자유낙하: 측정 g가 설정값과 일치', () => {
  const out = [];
  for (const g of [1.62, 9.81, 24.79]) {
    const w = fresh(); w.vacuum = true; w.g = g;
    const b = w.addBody({ type: 'iron', x: 1, y: 0.1, r: 0.05 }); w.select(b);
    for (let i = 0; i < 20; i++) w.step();
    const a = w.measuredAccel(b);
    assert(Math.abs(a - g) / g < 0.001, `g=${g}인데 측정 ${a}`);
    out.push(`${g}→${a.toFixed(3)}`);
  }
  return out.join(', ');
});

test('열 전도: 닫힌 금속 안에서 에너지 보존', () => {

  const before = energy();

test('고체 덩어리: 나무는 물에 뜨고 돌은 가라앉고, 높이 떨어진 유리는 깨짐', () => {
  const w = fresh();
  w.rect('glass', 0, 145, 239, 149, null, true); w.rect('glass', 100, 80, 101, 144, null, true); w.rect('glass', 200, 80, 201, 144, null, true);
  w.rect('water', 102, 100, 199, 144);
  w.paint(120, 40, 4, w.data.idOf.wood, false, false); w.paint(170, 40, 3, w.data.idOf.stone, false, false); w.paint(40, 30, 3, w.data.idOf.glass, false, false);
  w.paint(60, 141, 2, w.data.idOf.wood, false, false); // 바닥에 놓인 것은 그대로
  const span = (id, x0, x1) => { const k = w.data.idOf[id]; let lo = 999, hi = -1; for (let i = 0; i < w.mat.length; i++) { const x = i % w.w; if (w.mat[i] === k && x >= x0 && x <= x1) { const y = (i / w.w) | 0; lo = Math.min(lo, y); hi = Math.max(hi, y); } } return [lo, hi]; };
  run(w, 6);
  const wood = span('wood', 102, 199), stone = span('stone', 102, 199), rest = span('wood', 50, 70);
  let shards = 0; for (const m of w.mat) if (m === w.data.idOf.glassshards) shards++;
  assert(wood[0] < 100 && wood[1] > 100 && wood[1] < 110, `나무 y${wood}`);
  assert(stone[1] === 144, `돌 y${stone}`);
  assert(shards > 10, `유리 조각 ${shards}`);
  assert(rest[1] === 143 || rest[1] === 144, `바닥의 나무 y${rest}`);
  return `나무 y${wood[0]}~${wood[1]}(수면 약 100), 돌 바닥 ${stone[1]}, 유리 조각 ${shards}칸`;
});
test('도구: 그릇 만들기와 높이까지 채우기', () => {

  assert(w.vessel(80, 90, 160, 144, 'glass'), '그릇 실패');
  const water = w.data.idOf.water;
  const n = w.fillLevel(120, 110, water);
  assert(n > 2000 && n < 3000, `채운 칸 ${n}`);
  let top = 999; for (let i = 0; i < w.mat.length; i++) if (w.mat[i] === water) top = Math.min(top, (i / w.w) | 0);
  assert(top === 110, `수면 y=${top}`);
  assert(w.fillLevel(120, 20, water) === 0, '열린 공간도 채움');
  return `그릇 안 ${n}칸, 수면 y=${top}`;
});
test('압력 도구: 보일 법칙, 진공에서 끓음, 캔 찌그러짐', () => {
  const w = fresh(); scene(w, 'pressure');
  run(w, 0.5);
  const P = (x, y) => w.inspect(x, y).P;
  const p0 = P(196, 120);
  // 피스톤을 아래로 밀어 부피를 절반 가까이 줄인다.
  for (let y = 62; y <= 100; y++) for (let x = 162; x <= 230; x++) w.pistonPush(x, y, 0);
  run(w, 0.5);
  const p1 = P(196, 120);
  const V0 = (230 - 162 + 1) * (143 - 62 + 1), V1 = (230 - 162 + 1) * (143 - 101 + 1);
  assert(Math.abs(p1 / p0 - V0 / V1) < 0.08 * V0 / V1, `보일: ${p0.toFixed(3)} → ${p1.toFixed(3)}, 기대 ×${(V0 / V1).toFixed(2)}`);
  // 빼면 다시 내려간다.
  for (let y = 62; y <= 100; y++) for (let x = 162; x <= 230; x++) w.pistonPull(x, y, 0);
  run(w, 0.5);
  const p2 = P(196, 120);
  assert(Math.abs(p2 - p0) < 0.05, `되돌림 ${p2}`);
  // 유리 용기의 기체를 빼면 물이 끓는다(수증기 생김).
  for (let k = 0; k < 120; k++) { w.pumpGas(40, 80, 25, 0.9); w.step(); }
  run(w, 3);
  const boiled = w.discovered.has('vacuum_boil') && P(40, 80) < 0.1;
  assert(boiled, `진공 끓음 P=${P(40, 80).toFixed(3)} ${[...w.discovered].join()}`);
  // 캔의 기체를 빼면 찌그러진다.
  for (let k = 0; k < 60; k++) { w.pumpGas(118, 100, 25, 0.85); w.step(); }
  run(w, 1);
  assert(w.discovered.has('implode'), '캔이 안 찌그러짐');
  return `보일 ${p0.toFixed(2)} → ${p1.toFixed(2)}기압(부피 ×${(V1 / V0).toFixed(2)}), 진공 ${P(40, 80).toFixed(3)}기압에서 끓음, 캔 찌그러짐`;
});
test('움직이는 피스톤: 무게만큼 압축되고 데우면 올라감(샤를 법칙)', () => {
  const w = fresh(); w.rect('stone', 0, 146, 239, 149, null, true); w.rect('wall', 100, 20, 101, 145, null, true); w.rect('wall', 140, 20, 141, 145, null, true);
  w.rect('piston', 102, 80, 139, 84); for (let y = 80; y <= 84; y++) for (let x = 102; x <= 139; x++) w.loose[w.index(x, y)] = 1; w.looseN = 1;
  const bot = () => { let b = -1; for (let y = 0; y < 150; y++) if (w.mat[w.index(120, y)] === w.data.idOf.piston) b = y; return b; };
  run(w, 10);
  const P0 = w.inspect(120, 130).P, V0 = 145 - bot() - 1;
  assert(Math.abs(P0 - 1.038) < 0.015, `피스톤 아래 압력 ${P0}`);
  const heat = () => { for (let y = bot() + 1; y < 146; y++) for (let x = 102; x < 140; x++) { const i = w.index(x, y); if (w.data.state[w.mat[i]] === 3) w.T[i] = 80; } };
  for (let i = 0; i < 1200; i++) { heat(); w.step(); }
  const V1 = 145 - bot() - 1, ratio = V1 / V0, want = 353.15 / 293.15;
  assert(Math.abs(ratio - want) < 0.08, `부피 비 ${ratio.toFixed(3)} (이론 ${want.toFixed(3)})`);
  return `피스톤 아래 ${P0.toFixed(3)}기압(무게 0.038기압), 80°C로 데우면 부피 ×${ratio.toFixed(2)} (이론 ×${want.toFixed(2)})`;
});
test('공이 물을 밀어냄: 수면이 오르고 물보라, 나무 공은 뜸', () => {
  const tank = () => { const w = fresh(); w.rect('glass', 60, 145, 180, 149, null, true); w.rect('glass', 60, 60, 62, 145, null, true); w.rect('glass', 178, 60, 180, 145, null, true); w.rect('water', 63, 110, 177, 144); run(w, 1); return w; };
  const w = tank(), water = w.data.idOf.water;
  const level = () => { let s = 0; for (let x = 70; x < 170; x += 10) { for (let y = 60; y < 145; y++) if (w.mat[w.index(x, y)] === water) { s += y; break; } } return s / 10; };
  const L0 = level(); let fly = 0;
  w.addBody({ type: 'iron', r: 0.1, x: 1.2, y: 0.3, vx: 0, vy: 0 });
  for (let i = 0; i < 300; i++) { w.step(); fly = Math.max(fly, w.flyers.length); }
  run(w, 3);
  const L1 = level();
  assert(L1 < L0 - 1, `수면 ${L0} → ${L1}`);
  assert(fly > 20, `물보라 ${fly}`);
  assert(w.bodies[0].y / 0.01 > 125, '쇠공이 안 가라앉음');
  const v = tank(); v.addBody({ type: 'wood', r: 0.08, x: 1.2, y: 0.5, vx: 0, vy: 0 }); run(v, 10);
  const wy = v.bodies[0].y / 0.01;
  assert(wy > 104 && wy < 118, `나무 공 y=${wy}`);
  return `수면 y ${L0.toFixed(1)} → ${L1.toFixed(1)}, 물보라 ${fly}칸, 나무 공 중심 y=${wy.toFixed(1)}(수면 약 110)`;
});

test('농도: 묽혀도 녹은 양은 그대로, pH는 묽힌 만큼 오름', () => {
  const w = fresh(); w.rect('glass', 60, 145, 180, 149, null, true); w.rect('glass', 60, 60, 62, 145, null, true); w.rect('glass', 178, 60, 180, 145, null, true);
  w.rect('stirrer', 63, 144, 177, 144, null, true); w.rect('water', 63, 100, 177, 143); w.rect('hcl', 110, 95, 130, 99);
  const k = w.data.idOf.hcl, sum = () => { let s = 0; for (let i = 0; i < w.mat.length; i++) if (w.mat[i] === k) s += w.conc[i]; return s; };
  const s0 = sum(); run(w, 20); const s1 = sum();
  assert(Math.abs(s1 - s0) < 0.5, `녹은 양 ${s0} → ${s1}`);
  const pH = w.pHMeter(120, 125, 8), want = 1 + Math.log10((115 * 44 + 105) / 105);
  assert(Math.abs(pH - want) < 0.5, `pH ${pH.toFixed(2)} (이론 ${want.toFixed(2)})`);
  // 같은 농도면 pHAt이 정해진 식을 따른다
  const v = fresh(); v.rect('hcl', 10, 10, 12, 12); v.setConc(10, 10, 12, 12, 0.01); v.rect('vinegar', 20, 10, 22, 12); v.setConc(20, 10, 22, 12, 0.01);
  const pS = v.pHAt(v.index(11, 11)), pW = v.pHAt(v.index(21, 11)), pW0 = v.data.pH0[v.data.idOf.vinegar];
  assert(Math.abs(pS - 3) < 0.01 && Math.abs(pW - (pW0 + 1)) < 0.01, `강산 ${pS}, 약산 ${pW}`);
  return `녹은 양 ${s0.toFixed(1)} → ${s1.toFixed(1)}, 50배 묽힌 염산 pH ${pH.toFixed(2)} (이론 ${want.toFixed(2)}), 100배 묽히면 강산 pH 1→3, 약산 ${pW0}→${pW.toFixed(1)}`;
});
test('적정: 당량점에서 pH가 급하게 오르고 페놀프탈레인이 분홍', () => {
  const w = fresh(); scene(w, 'titration');
  const na = w.data.idOf.naoh, left = () => { let n = 0; for (let y = 15; y < 81; y++) for (let x = 118; x <= 122; x++) if (w.mat[w.index(x, y)] === na) n++; return n; };
  const n0 = left(); run(w, 2); w.toggleDevice(120, 81);
  const curve = [];
  for (let t = 0; t < 40; t++) { run(w, 1); curve.push([n0 - left(), w.pHMeter(120, 128, 8)]); }
  const eq = 55 * 29 * 0.1; // 산의 H⁺ 양 = 염기 방울 수
  const before = curve.filter(([u]) => u < eq * 0.7), after = curve.filter(([u]) => u > eq * 1.3);
  assert(before.length && before.every(([, p]) => p < 4), '당량점 전에 염기성');
  assert(after.length && after.every(([, p]) => p > 9), '당량점 뒤에 산성 ' + after.map(([u, p]) => u + ':' + p.toFixed(1)).join(' '));
  assert(w.discovered.has('indicator:phth:base'), '지시약이 안 바뀜');
  const jump = curve.find(([, p]) => p > 7);
  return `당량점 이론 ${eq.toFixed(0)}방울, pH 7을 넘은 곳 ${jump[0]}방울`;
});
test('농도: 묽은 산은 거품이 적고 묽은 중화는 열이 적음', () => {

test('용해도: 포화되면 더 안 녹고, 식히면 결정, 증발하면 진해짐', () => {
  const cnt = (w, id) => { const k = w.data.idOf[id]; let n = 0; for (const m of w.mat) if (m === k) n++; return n; };
  const units = (w, sol, cry) => { let s = 0; for (let i = 0; i < w.mat.length; i++) if (w.mat[i] === w.data.idOf[sol]) s += w.conc[i]; return s + 2 * cnt(w, cry); };
  // 포화된 소금물에는 소금이 더 녹지 않음
  const v = fresh(); v.rect('glass', 60, 145, 180, 149, null, true); v.rect('brine', 63, 120, 177, 144); v.setConc(63, 120, 177, 144, 3); v.rect('salt', 100, 110, 140, 119);
  run(v, 10);
  assert(cnt(v, 'salt') > 350 && v.discovered.has('saturated'), `포화인데 녹음: 남은 소금 ${cnt(v, 'salt')}`);
  // 질산칼륨: 20°C에서는 그대로, 3°C로 식히면 결정(양은 보존)
  const cool = (T) => { const w = fresh(); w.rect('glass', 60, 145, 180, 149, null, true); w.rect('A:KNO3', 63, 120, 177, 144, T); w.setConc(63, 120, 177, 144, 1.4);
    for (let i = 0; i < 1800; i++) { w.step(); for (let y = 110; y < 145; y++) for (let x = 63; x < 178; x++) { const k = w.index(x, y); if (w.data.state[w.mat[k]] === 2) w.T[k] = T; } } return w; };
  const warm = cool(20), cold = cool(3);
  const u0 = 115 * 25 * 1.4, uc = units(cold, 'A:KNO3', 'S:KNO3');
  assert(cnt(warm, 'S:KNO3') < 200 && cnt(cold, 'S:KNO3') > 1000, `결정 20°C ${cnt(warm, 'S:KNO3')}, 3°C ${cnt(cold, 'S:KNO3')}`);
  assert(Math.abs(uc - u0) < u0 * 0.03, `녹은 양 ${u0} → ${uc.toFixed(0)}`);
  // 증발: 남은 소금물이 진해지다가 소금 결정이 생김
  const e = fresh(); e.rect('stone', 60, 145, 180, 149, null, true); e.rect('brine', 63, 140, 177, 144, 80);
  for (let i = 0; i < 3000; i++) { e.step(); for (let y = 135; y < 145; y++) for (let x = 63; x < 178; x++) { const k = e.index(x, y); if (e.data.state[e.mat[k]] === 2) e.T[k] = 80; } }
  let s = 0, n = 0; for (let i = 0; i < e.mat.length; i++) if (e.mat[i] === e.data.idOf.brine) { s += e.conc[i]; n++; }
  assert(cnt(e, 'salt') > 30 && (!n || s / n > 1.5), `소금 결정 ${cnt(e, 'salt')}, 남은 소금물 평균 농도 ${n ? (s / n).toFixed(2) : '-'}`);
  return `포화: 소금 ${cnt(v, 'salt')}칸 남음 · 질산칼륨 결정 20°C ${cnt(warm, 'S:KNO3')} / 3°C ${cnt(cold, 'S:KNO3')}칸(양 ${u0.toFixed(0)} → ${uc.toFixed(0)}) · 증발: 결정 ${cnt(e, 'salt')}칸, 남은 소금물 ×${n ? (s / n).toFixed(1) : '-'}`;
});
test('온도와 반응 속도: 데운 산에서 더 빨리 녹음', () => {
  const run1 = (T) => { const w = fresh(); w.rect('glass', 60, 145, 180, 149, null, true); w.rect('hcl', 63, 120, 177, 144, T); w.rect('Fe', 90, 141, 150, 144, T, true);

test('충격에 민감한 물질: 떨어뜨리면 터지고 모래에 흡수시키면(다이너마이트) 안 터짐', () => {

test('옴의 법칙: 전압·저항과 전류, 병렬, 줄열, 퓨즈, 전지 전압', () => {
  const mk = (V, load) => { const w = fresh(); w.rect('electrode+', 40, 90, 42, 110, null, true); w.rect('wire', 43, 90, 80, 91, null, true); load(w); w.rect('electrode-', 151, 90, 153, 110, null, true); w.voltage = V; run(w, 1); return w; };
  const bulb1 = (w) => { w.rect('bulb', 81, 88, 85, 93, null, true); w.rect('wire', 86, 90, 150, 91, null, true); };
  const a = mk(6, bulb1), b = mk(12, bulb1);
  const Rt = a.elec.R + 0.5;
  assert(Math.abs(a.elec.I - 6 / Rt) < 1e-6 && Math.abs(b.elec.I / a.elec.I - 2) < 0.01, `I 6V ${a.elec.I}, 12V ${b.elec.I}`);
  // 병렬로 전구를 하나 더 달면 전류가 커진다
  const c = mk(6, (w) => { bulb1(w); w.rect('wire', 79, 74, 80, 89, null, true); w.rect('bulb', 81, 74, 85, 79, null, true); w.rect('wire', 86, 74, 150, 75, null, true); w.rect('wire', 149, 76, 150, 89, null, true); });
  assert(c.elec.I > a.elec.I * 1.5, `병렬 ${c.elec.I} vs ${a.elec.I}`);
  // 니크롬선은 줄열로 달아오르고, 길면 저항이 커서 덜 뜨겁다
  const nich = (len) => { const w = mk(12, (v) => { v.rect('nichrome', 81, 90, 80 + len, 90, null, true); v.rect('wire', 81 + len, 90, 150, 91, null, true); }); run(w, 5); return [w.elec.R, w.T[w.index(81 + (len >> 1), 90)]]; };
  const [r30, t30] = nich(30), [r60, t60] = nich(60);
  assert(Math.abs(r60 / r30 - 2) < 0.1 && t30 > 400 && t30 > t60, `R ${r30}/${r60}, T ${t30}/${t60}`);
  // 합선되면 퓨즈가 끊어짐
  const f = fresh(); f.rect('electrode+', 40, 90, 42, 110, null, true); f.rect('wire', 43, 90, 60, 91, null, true); f.rect('fuse', 61, 90, 64, 91, null, true); f.rect('wire', 65, 90, 150, 91, null, true); f.rect('electrode-', 151, 90, 153, 110, null, true);
  run(f, 3);
  assert(f.mat[f.index(62, 90)] === f.data.idOf['fuse:blown'], '퓨즈가 안 끊어짐');
  // 레몬 전지(아연-구리)의 전압은 약 1.1 V
  const g = fresh(); g.rect('glass', 60, 145, 180, 149, null, true); g.rect('A:citric', 63, 95, 177, 144); g.rect('Zn:s', 90, 85, 93, 140, 20, true); g.rect('Cu:s', 147, 85, 150, 140, 20, true);
  g.rect('wire', 90, 60, 93, 84, 20, true); g.rect('wire', 147, 60, 150, 84, 20, true); g.rect('wire', 94, 60, 146, 62, 20, true); g.rect('bulb', 118, 60, 121, 62, 20, true); run(g, 1);
  const E = g.cells && g.cells[0] && g.cells[0].E;
  assert(Math.abs(E - 1.10) < 0.01, `전지 전압 ${E}`);
  return `6 V → ${a.elec.I.toFixed(2)} A, 12 V → ${b.elec.I.toFixed(2)} A, 병렬 ${c.elec.I.toFixed(2)} A, 니크롬 30칸 ${r30.toFixed(1)} Ω ${t30.toFixed(0)}°C / 60칸 ${r60.toFixed(1)} Ω ${t60.toFixed(0)}°C, 퓨즈 끊김, 아연-구리 ${E.toFixed(2)} V`;
});
test('성능: 틱당 시간', () => {
  const out = [];
  for (const id of ['volcano', 'precip', 'furnace']) {
    const w = fresh(); scene(w, id);
    const t = performance.now();
    for (let i = 0; i < 120; i++) w.step();

    out.push(`${id} ${ms.toFixed(2)}ms`);
  }
  return out.join(', ');
});
